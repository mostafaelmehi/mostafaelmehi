<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Moustafa Elmehy — AI Engineer · NLP &amp; LLMs · MLOps">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.55" stop-color="#0d1a33"/>
      <stop offset="1" stop-color="#0a2a3a"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#b9e6ff"/>
      <stop offset="1" stop-color="#5fd3ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36bcf7"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#36bcf7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#36bcf7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <style>
      .t { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; }
      .fade { opacity: 0; animation: fadeUp .9s ease-out forwards; }
      .d1 { animation-delay: .1s } .d2 { animation-delay: .45s } .d3 { animation-delay: .8s } .d4 { animation-delay: 1.1s }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: translateY(0) } }

      .rot { opacity: 0; animation: rot 12s infinite; }
      .r2 { animation-delay: 3s } .r3 { animation-delay: 6s } .r4 { animation-delay: 9s }
      @keyframes rot { 0% {opacity:0} 4% {opacity:1} 22% {opacity:1} 26% {opacity:0} 100% {opacity:0} }

      .caret { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }

      .node { animation: pulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .n1 { animation-delay: 0s } .n2 { animation-delay: .5s } .n3 { animation-delay: 1s } .n4 { animation-delay: 1.5s }
      @keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.25) } }

      .edge { stroke: #36bcf7; stroke-opacity: .18; stroke-width: 1.2; }
      .float { animation: float 6s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <circle cx="930" cy="170" r="230" fill="url(#glow)"/>

  <!-- ===== neural network (right) ===== -->
  <g class="float">
    <!-- edges layer1 -> layer2 -->
    <g class="edge">
      <line x1="770" y1="90"  x2="900" y2="70"/>  <line x1="770" y1="90"  x2="900" y2="140"/> <line x1="770" y1="90"  x2="900" y2="210"/> <line x1="770" y1="90"  x2="900" y2="280"/>
      <line x1="770" y1="170" x2="900" y2="70"/>  <line x1="770" y1="170" x2="900" y2="140"/> <line x1="770" y1="170" x2="900" y2="210"/> <line x1="770" y1="170" x2="900" y2="280"/>
      <line x1="770" y1="250" x2="900" y2="70"/>  <line x1="770" y1="250" x2="900" y2="140"/> <line x1="770" y1="250" x2="900" y2="210"/> <line x1="770" y1="250" x2="900" y2="280"/>
      <!-- layer2 -> layer3 -->
      <line x1="900" y1="70"  x2="1030" y2="105"/> <line x1="900" y1="70"  x2="1030" y2="235"/>
      <line x1="900" y1="140" x2="1030" y2="105"/> <line x1="900" y1="140" x2="1030" y2="235"/>
      <line x1="900" y1="210" x2="1030" y2="105"/> <line x1="900" y1="210" x2="1030" y2="235"/>
      <line x1="900" y1="280" x2="1030" y2="105"/> <line x1="900" y1="280" x2="1030" y2="235"/>
      <!-- layer3 -> output -->
      <line x1="1030" y1="105" x2="1130" y2="170"/> <line x1="1030" y1="235" x2="1130" y2="170"/>
    </g>

    <!-- signals travelling along edges -->
    <g fill="#5fd3ff">
      <circle r="3.5"><animateMotion dur="2.4s" repeatCount="indefinite" path="M770 90 L900 140 L1030 105 L1130 170"/></circle>
      <circle r="3.5"><animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" path="M770 250 L900 210 L1030 235 L1130 170"/></circle>
      <circle r="3.5" fill="#a48bff"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" path="M770 170 L900 70 L1030 105 L1130 170"/></circle>
      <circle r="3.5" fill="#a48bff"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M770 170 L900 280 L1030 235 L1130 170"/></circle>
    </g>

    <!-- nodes -->
    <g fill="#0d1a33" stroke="#36bcf7" stroke-width="2">
      <circle class="node n1" cx="770" cy="90"  r="10"/>
      <circle class="node n2" cx="770" cy="170" r="10"/>
      <circle class="node n3" cx="770" cy="250" r="10"/>
      <circle class="node n2" cx="900" cy="70"  r="9"/>
      <circle class="node n3" cx="900" cy="140" r="9"/>
      <circle class="node n4" cx="900" cy="210" r="9"/>
      <circle class="node n1" cx="900" cy="280" r="9"/>
      <circle class="node n3" cx="1030" cy="105" r="10" stroke="#7c5cff"/>
      <circle class="node n4" cx="1030" cy="235" r="10" stroke="#7c5cff"/>
    </g>
    <circle cx="1130" cy="170" r="18" fill="#36bcf7" opacity=".35" filter="url(#soft)">
      <animate attributeName="r" values="16;24;16" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1130" cy="170" r="12" fill="#0d1a33" stroke="url(#accent)" stroke-width="3"/>

    <!-- layer labels -->
    <g class="mono" font-size="11" fill="#7fa9c9" text-anchor="middle" opacity=".8">
      <text x="770"  y="290">data</text>
      <text x="900"  y="318">model</text>
      <text x="1030" y="275">eval</text>
      <text x="1130" y="210">deploy</text>
    </g>
  </g>

  <!-- ===== text (left) ===== -->
  <g class="t">
    <text class="fade d1 mono" x="64" y="78" font-size="15" fill="#5fd3ff" letter-spacing="2">&gt; HELLO, WORLD — I'M</text>
    <text class="fade d2" x="60" y="148" font-size="64" font-weight="800" fill="url(#nameGrad)" letter-spacing="-1">Moustafa Elmehy</text>
    <rect class="fade d2" x="64" y="166" width="120" height="4" rx="2" fill="url(#accent)"/>
    <text class="fade d3" x="64" y="208" font-size="24" font-weight="600" fill="#e6f1ff">AI Engineer · NLP &amp; LLMs · MLOps</text>

    <!-- rotating taglines -->
    <g class="mono fade d4" font-size="17" fill="#9fb7d4">
      <text x="64" y="252">$ </text>
      <text class="rot r1" x="84" y="252">fine-tuning LLaMA 3.2 with QLoRA</text>
      <text class="rot r2" x="84" y="252">building RAG pipelines &amp; AI agents</text>
      <text class="rot r3" x="84" y="252">shipping models: FastAPI · MLflow · Docker</text>
      <text class="rot r4" x="84" y="252">evaluating AI outputs, not just generating them</text>
    </g>

    <!-- location chip -->
    <g class="fade d4">
      <rect x="64" y="280" width="250" height="30" rx="15" fill="#ffffff" fill-opacity=".06" stroke="#36bcf7" stroke-opacity=".35"/>
      <circle cx="84" cy="295" r="5" fill="#3ddc97"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <text x="98" y="300" font-size="14" fill="#cfe3f7">Dortmund, DE · open to work</text>
    </g>
  </g>
</svg>
